name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned so a runner image update can't change the toolchain under us.
  XCODE_APP: /Applications/Xcode_27.2.app

jobs:
  rust:
    name: Rust
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The release ships a universal binary; catch Intel-only breakage here.
      - run: cargo check --workspace --target x86_64-apple-darwin

  app:
    name: App
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select --switch "$XCODE_APP"
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: brew install xcodegen
      - run: scripts/build-core.sh
      - run: xcodegen generate --spec app/project.yml --project app
      - name: Build
        run: |
          xcodebuild build \
            -project app/Bamboo.xcodeproj -scheme Bamboo -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build/DerivedData \
            BAMBOO_SKIP_CORE_BUILD=1 CODE_SIGN_IDENTITY=- -quiet
      - name: Test
        run: |
          xcodebuild test \
            -project app/Bamboo.xcodeproj -scheme Bamboo -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build/DerivedData \
            BAMBOO_SKIP_CORE_BUILD=1 CODE_SIGN_IDENTITY=- -quiet

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
