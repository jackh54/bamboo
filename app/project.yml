name: Bamboo
options:
  bundleIdPrefix: dev.pandascript
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: 0.1.0 # x-release-please-version
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.1"

targets:
  Bamboo:
    type: application
    platform: macOS
    sources:
      - path: Bamboo
    dependencies:
      - package: Sparkle
      - sdk: Security.framework
      - sdk: WebKit.framework
    info:
      path: Bamboo/Resources/Info.plist
      properties:
        CFBundleDisplayName: Bamboo
        CFBundleName: Bamboo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© PandaScript. MIT licensed."
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSCameraUsageDescription: Websites you allow can use the camera.
        NSMicrophoneUsageDescription: Websites you allow can use the microphone.
        NSLocationUsageDescription: Websites you allow can see your approximate location.
        NSLocationWhenInUseUsageDescription: Websites you allow can see your approximate location.
        CFBundleURLTypes:
          - CFBundleURLName: Web site URL
            CFBundleURLSchemes: [http, https]
            CFBundleTypeRole: Viewer
        CFBundleDocumentTypes:
          - CFBundleTypeName: HTML document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes: [public.html, public.xhtml]
          - CFBundleTypeName: Web archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.apple.webarchive]
        SUFeedURL: https://github.com/jackh54/bamboo/releases/latest/download/appcast.xml
        SUPublicEDKey: ""
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 21600
    entitlements:
      path: Bamboo/Resources/Bamboo.entitlements
      properties:
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.location: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pandascript.Bamboo
        PRODUCT_NAME: Bamboo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/../target/bamboo-out/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../target/bamboo-out
        OTHER_LDFLAGS: [-lbamboo_core]
        SWIFT_STRICT_CONCURRENCY: complete
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    preBuildScripts:
      - name: Build Rust core
        script: |
          if [ "${BAMBOO_SKIP_CORE_BUILD:-0}" = "1" ]; then exit 0; fi
          "$SRCROOT/../scripts/build-core.sh"
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Embed bamboo-mcp
        script: |
          set -euo pipefail
          dest="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/bamboo-mcp"
          cp "$SRCROOT/../target/bamboo-out/bamboo-mcp" "$dest"
          codesign --force --options runtime --timestamp=none --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$dest"
        basedOnDependencyAnalysis: false

  BambooTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BambooTests
    dependencies:
      - target: Bamboo
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Bamboo.app/Contents/MacOS/Bamboo
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/../target/bamboo-out/include
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Bamboo:
    build:
      targets:
        Bamboo: all
        BambooTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [BambooTests]
    archive:
      config: Release
