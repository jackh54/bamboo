[package]
name = "bamboo-shields"
description = "Ad and tracker blocking built on Brave's adblock-rust engine."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
uniffi.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
# No `single-thread`: that feature makes `Engine` !Sync, and `Shields` is shared across threads.
adblock = { version = "0.13", default-features = false, features = ["content-blocking", "embedded-domain-resolver", "full-regex-handling"] }
sha2 = "0.10"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
